<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The life of a navigation task</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  body { margin: 0; padding: 2rem; background: #f7f7f7; font-family: 'Geist', sans-serif; color: #193058; }
  .eyebrow { font-family: 'Geist Mono', monospace; font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; color: #7d8bab; margin: 0 0 0.5rem; }
  h1 { font-family: 'Instrument Serif', serif; font-weight: 400; font-size: 1.75rem; margin: 0 0 1.5rem; }
  svg { max-width: 100%; height: auto; }
</style>
</head>
<body>
<p class="eyebrow">ROBODOG-SDK · CONCEPTS</p>
<h1>The life of a navigation task</h1>
<svg viewBox="0 0 920 480" role="img" aria-labelledby="robodog-navlife-title robodog-navlife-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="robodog-navlife-title">Navigation task lifecycle</title>
  <desc id="robodog-navlife-desc">A submitted goal is either refused — there is no queue — or accepted and runs with a changing activity while its state stays RUNNING; the task ends in exactly one of four terminal states, and only SUCCEEDED means the robot arrived.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#4a5f85"/>
    </marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#b6163d"/>
    </marker>
    <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#007ea6"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#f7f7f7"/>

  <!-- Transitions (before boxes) -->
  <circle cx="76" cy="120" r="6" fill="#193058"/>
  <line x1="82" y1="120" x2="120" y2="120" stroke="#4a5f85" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="288" y1="120" x2="392" y2="120" stroke="#4a5f85" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="304" y="100" width="72" height="12" rx="2" fill="#f7f7f7"/>
  <text x="340" y="109" fill="#7d8bab" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">accepted</text>
  <line x1="204" y1="144" x2="204" y2="224" stroke="#4a5f85" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <rect x="216" y="176" width="176" height="12" rx="2" fill="#f7f7f7"/>
  <text x="220" y="185" fill="#7d8bab" font-size="8" font-family="'Geist Mono', monospace">no queue — one task at a time</text>

  <path d="M 432,200 V 276 Q 432,284 424,284 H 162 Q 154,284 154,292 V 320" fill="none" stroke="#b6163d" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
  <path d="M 480,200 V 288 Q 480,296 472,296 H 366 Q 358,296 358,304 V 320" fill="none" stroke="#4a5f85" stroke-width="1.2" marker-end="url(#arrow)"/>
  <path d="M 528,200 V 288 Q 528,296 536,296 H 554 Q 562,296 562,304 V 320" fill="none" stroke="#4a5f85" stroke-width="1.2" marker-end="url(#arrow)"/>
  <path d="M 576,200 V 264 Q 576,272 584,272 H 758 Q 766,272 766,280 V 320" fill="none" stroke="#4a5f85" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Submitted -->
  <rect x="120" y="96" width="168" height="48" rx="8" fill="#ffffff" stroke="#193058" stroke-width="1"/>
  <text x="204" y="116" fill="#193058" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Goal submitted</text>
  <text x="204" y="132" fill="#4a5f85" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">navigate_to · submit</text>

  <!-- Refused -->
  <rect x="120" y="224" width="168" height="48" rx="8" fill="rgba(25,48,88,0.02)" stroke="rgba(25,48,88,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="204" y="244" fill="#193058" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Refused</text>
  <text x="204" y="260" fill="#4a5f85" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">PermissionError · handle.reason</text>

  <!-- Running -->
  <rect x="392" y="88" width="240" height="112" rx="8" fill="#ffffff" stroke="#193058" stroke-width="1"/>
  <text x="512" y="112" fill="#193058" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">RUNNING</text>
  <text x="512" y="128" fill="#4a5f85" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">feedback.state — the whole time</text>
  <rect x="408" y="144" width="64" height="16" rx="2" fill="#f0f0f0" stroke="rgba(25,48,88,0.20)" stroke-width="0.8"/>
  <text x="440" y="155" fill="#4a5f85" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">cruising</text>
  <rect x="480" y="144" width="64" height="16" rx="2" fill="#f0f0f0" stroke="rgba(25,48,88,0.20)" stroke-width="0.8"/>
  <text x="512" y="155" fill="#4a5f85" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">aligning</text>
  <rect x="552" y="144" width="64" height="16" rx="2" fill="#f0f0f0" stroke="rgba(25,48,88,0.20)" stroke-width="0.8"/>
  <text x="584" y="155" fill="#4a5f85" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">stalled</text>
  <rect x="444" y="168" width="80" height="16" rx="2" fill="#f0f0f0" stroke="rgba(25,48,88,0.20)" stroke-width="0.8"/>
  <text x="484" y="179" fill="#4a5f85" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">retreating</text>
  <text x="576" y="179" fill="#7d8bab" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">activity</text>

  <!-- Outcomes -->
  <rect x="64" y="320" width="180" height="56" rx="8" fill="rgba(182,22,61,0.07)" stroke="#b6163d" stroke-width="1.2"/>
  <text x="154" y="344" fill="#193058" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">SUCCEEDED</text>
  <text x="154" y="362" fill="#4a5f85" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">the only arrival</text>
  <rect x="268" y="320" width="180" height="56" rx="8" fill="#ffffff" stroke="#193058" stroke-width="1"/>
  <text x="358" y="344" fill="#193058" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">BLOCKED</text>
  <text x="358" y="362" fill="#4a5f85" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">met the world — not an error</text>
  <rect x="472" y="320" width="180" height="56" rx="8" fill="#ffffff" stroke="#193058" stroke-width="1"/>
  <text x="562" y="344" fill="#193058" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">FAILED</text>
  <text x="562" y="362" fill="#4a5f85" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">something went wrong</text>
  <rect x="676" y="320" width="180" height="56" rx="8" fill="#ffffff" stroke="#193058" stroke-width="1"/>
  <text x="766" y="344" fill="#193058" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">CANCELED</text>
  <text x="766" y="362" fill="#4a5f85" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">cancel_task · e-stop</text>

  <!-- Editorial aside -->
  <text x="392" y="440" fill="#4a5f85" font-size="14" font-family="'Instrument Serif', serif" font-style="italic">Only the result carries the verdict — feedback.state never leaves RUNNING.</text>
</svg>
</body>
</html>
