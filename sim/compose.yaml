# ============================================================================
#  Simulated Robodog control stack
#
#      docker compose up
#
#  Web viewer:  http://localhost:7070
#  Nav UI:      http://localhost:8091
#  MOLA UI:     http://localhost:8088
#  Zenoh:       tcp/localhost:7447
#
#  Options:
#    SIM_SCENE          MuJoCo scene                          (default: room)
#    SIM_SESSION        MOLA map session                      (default: sim)
#    SIM_MODE           localize | mapping                    (default: localize)
#    SIM_INITIAL_POSE   x,y,yaw_deg where the robot starts    (default: 0,0,0)
#    SIM_MAP_IMAGE      the image holding the map session     (default: below)
#    SIM_CAMERA         publish the Go2 camera (true|false)   (default: true)
#    SIM_CAMERA_FPS     camera frame rate                     (default: 15)
# ============================================================================
name: robodog-sim

services:

  zenoh-router:
    image: eclipse/zenoh:1.10.0
    init: true
    command: ["--config", "/etc/zenoh/config.json"]
    configs:
      - source: zenoh-router-config
        target: /etc/zenoh/config.json
    ports:
      - "7447:7447"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8000/@/router/local || exit 1"]
      interval: 5s
      timeout: 4s
      retries: 10
      start_period: 3s
    restart: unless-stopped

  sim-stack:
    image: ghcr.io/hse-deb-robodog/robodog-sim-stack:latest
    init: true
    depends_on:
      zenoh-router:
        condition: service_healthy
    environment:
      ZENOH_ROUTER_ENDPOINT: tcp/zenoh-router:7447
      MOLA_API_URL: http://mola:8088
      SIM_SCENE: ${SIM_SCENE:-room}
      SIM_CAMERA: ${SIM_CAMERA:-true}
      SIM_CAMERA_FPS: ${SIM_CAMERA_FPS:-15}
    ports:
      - "7070:7070"   # mjviser web viewer
      - "8091:8091"   # nav-map web UI
    # Gamepad teleoperation (Linux only):
    #   - /dev/input:/dev/input
    restart: unless-stopped

  sim-map:
    image: ${SIM_MAP_IMAGE:-ghcr.io/hse-deb-robodog/robodog-sim-map:2026-11-01}
    volumes:
      - mola-maps:/data/maps

  mola:
    image: ghcr.io/hse-deb-robodog/robodog-mola:latest
    depends_on:
      zenoh-router:
        condition: service_healthy
      sim-map:
        condition: service_completed_successfully
    environment:
      ZENOH_ROUTER_ENDPOINT: tcp/zenoh-router:7447
      MOLA_AUTOSTART_SOURCE: sim
      MOLA_AUTOSTART_MODE: ${SIM_MODE:-localize}
      MOLA_AUTOSTART_SESSION: ${SIM_SESSION:-sim}
      MOLA_AUTOSTART_INITIAL_POSE: ${SIM_INITIAL_POSE:-0,0,0}
      MOLA_AUTOSTART_LOCALIZE: ${SIM_SESSION:-sim}
    volumes:
      - mola-maps:/data/maps
    ports:
      - "8088:8088"   # MOLA control API + operator UI
      - "8765:8765" # Foxglove bridge
    stop_grace_period: 90s
    restart: unless-stopped

configs:
  zenoh-router-config:
    content: |
      {
        "plugins": {
          "rest": { "http_port": 8000 },
          "storage_manager": {
            "volumes": { "memory": {} },
            "storages": {
              "robodog_system_state": { "key_expr": "robodog/system_state/**", "volume": { "id": "memory" } },
              "robodog_diagnostic":   { "key_expr": "robodog/diagnostic/**",   "volume": { "id": "memory" } },
              "robodog_command":      { "key_expr": "robodog/command/**",      "volume": { "id": "memory" } },
              "robodog_map":          { "key_expr": "robodog/map/**",          "volume": { "id": "memory" } },
              "nav":                  { "key_expr": "nav/**",                  "volume": { "id": "memory" } },
              "nodes":                { "key_expr": "nodes/**",                "volume": { "id": "memory" } }
            }
          }
        }
      }

volumes:
  mola-maps:
